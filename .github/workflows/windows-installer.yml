# Windows 用インストーラー（NSIS の .exe と WiX の .msi）をビルドして Artifacts に置く。
# Actions タブ → 該当の実行 → Artifacts から .exe / .msi をそのままダウンロードできる。
# 配布用の正式版は release.yml（リリースを Publish すると GitHub Releases に添付）を使う。
name: Windows installer

on:
  push:
    # タグの push では動かさない（リリース用のビルドは release.yml が担当）
    branches: ["**"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run tauri build

      # archive: false で zip に包まずアップロードする（ダウンロードしたらそのままダブルクリックできる）
      - name: Upload installer (.exe)
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          archive: false
          if-no-files-found: error

      - name: Upload installer (.msi)
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/msi/*.msi
          archive: false
          if-no-files-found: error
