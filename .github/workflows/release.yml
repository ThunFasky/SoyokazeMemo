# GitHub Releases にインストーラーを添付する。
#   - Windows: -setup.exe / .msi
#   - macOS:   .dmg（Intel / Apple シリコン両対応のユニバーサル版）
# Windows と macOS は並行してビルドし、片方が失敗してももう片方は添付される。
#
# 動くタイミング
#   - Releases 画面で "Draft a new release" → Publish したとき（タグ名は自由: v0.1.0, Beta など）
#   - Actions タブ → Release → "Run workflow" でタグ名を指定したとき
#     （既にあるリリースに後から添付し直したいとき用。リリースが無ければ作る）
#
# v1.2.3 形式のタグの場合だけ、tauri.conf.json の version と一致しているかチェックする。
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "添付先のリリースのタグ名（例: v0.1.0, Beta）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-args: ""
            files: src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            build-args: --target universal-apple-darwin
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check version (only for v1.2.3 style tags)
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$TAG" =~ ^v[0-9] ]] && [ "$TAG" != "v${version}" ]; then
            echo "::error::タグ ${TAG} と tauri.conf.json の version (${version}) が一致しません"
            exit 1
          fi
          echo "tag=${TAG} / app version=${version}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS のユニバーサル版は Intel / Apple シリコンの両方をビルドする（Windows では使わない）
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run tauri build -- ${{ matrix.build-args }}

      - name: Attach installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ matrix.files }}
        run: |
          files=($FILES)
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # Windows と macOS が同時に作ろうとすることがあるので、作れなくても（もうあれば）そのまま進む
            gh release create "$TAG" --title "SoyokazeMemo ${TAG}" --generate-notes || gh release view "$TAG" > /dev/null
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
