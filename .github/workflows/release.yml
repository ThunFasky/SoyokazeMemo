# v から始まるタグ（例: v0.1.0）を push すると、Windows インストーラーをビルドして
# GitHub Releases に添付する。配布先の人は Releases から -setup.exe を落としてダブルクリックするだけ。
#
# タグの付け方（どちらでも OK）
#   - GitHub の Releases → "Draft a new release" → タグ欄に v0.1.0 と入力して Publish
#   - git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} と tauri.conf.json の version (${version}) が一致しません"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run tauri build

      - name: Attach installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/msi/*.msi)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Releases 画面から作った場合はリリースが既にあるので、ファイルだけ追加する
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "SoyokazeMemo ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
